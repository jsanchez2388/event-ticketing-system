{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h1>Edit Event</h1>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="/site/admin/events/{{ event.event_id }}/edit"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>Event Title</label>

        <input
            type="text"
            name="title"
            value="{{ event.title }}"
            required
        >

        <label>Event Type</label>

        <input
            type="text"
            name="event_type"
            value="{{ event.event_type }}"
            required
        >

        <label>Venue</label>

        <select name="venue_id" required>

            {% for venue in venues %}

                <option
                    value="{{ venue.venue_id }}"
                    {% if venue.venue_id == event.venue_id %}
                        selected
                    {% endif %}
                >
                    {{ venue.venue_name }}
                    -
                    {{ venue.city }},
                    {{ venue.state }}
                </option>

            {% endfor %}

        </select>

        <label>Start Date and Time</label>

        <input
            type="datetime-local"
            name="start_datetime"
            value="{{ event.start_datetime.strftime('%Y-%m-%dT%H:%M') }}"
            required
        >

        <label>End Date and Time</label>

        <input
            type="datetime-local"
            name="end_datetime"
            value="{{ event.end_datetime.strftime('%Y-%m-%dT%H:%M') }}"
            required
        >

        <label>Status</label>

        <select name="status">

            <option
                value="scheduled"
                {% if event.status == "scheduled" %}selected{% endif %}
            >
                Scheduled
            </option>

            <option
                value="cancelled"
                {% if event.status == "cancelled" %}selected{% endif %}
            >
                Cancelled
            </option>

            <option
                value="completed"
                {% if event.status == "completed" %}selected{% endif %}
            >
                Completed
            </option>

        </select>

        <div class="form-actions">

            <button type="submit">
                Save Changes
            </button>

            <a href="/site/admin">
                Cancel
            </a>

        </div>

    </form>

</div>

<style>
.form-page {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px;
}

.form-page form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.form-page label {
    font-weight: bold;
    margin-top: 12px;
}

.form-page input,
.form-page select {
    padding: 10px;
    font-size: 1rem;
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.error-message {
    padding: 12px;
    border: 1px solid #b00020;
    margin-bottom: 20px;
}
</style>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h1>Add Ticket Type</h1>

    <h2>{{ event.title }}</h2>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="/site/admin/events/{{ event.event_id }}/ticket-types/create"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>Ticket Name</label>

        <input
            type="text"
            name="ticket_name"
            placeholder="General Admission"
            required
        >

        <label>Price</label>

        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            placeholder="50.00"
            required
        >

        <label>Total Quantity</label>

        <input
            type="number"
            name="total_quantity"
            min="0"
            placeholder="100"
            required
        >

        <label>Minimum Purchase</label>

        <input
            type="number"
            name="minimum_purchase"
            min="1"
            value="1"
            required
        >

        <label>Maximum Purchase</label>

        <input
            type="number"
            name="maximum_purchase"
            min="1"
            value="10"
            required
        >

        <label>Status</label>

        <select name="status">

            <option value="active">
                Active
            </option>

            <option value="inactive">
                Inactive
            </option>

        </select>

        <div class="form-actions">

            <button type="submit">
                Create Ticket Type
            </button>

            <a href="/site/admin">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
